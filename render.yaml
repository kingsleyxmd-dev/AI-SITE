services:
  - type: web
    name: kiri-ai-chatbot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false   # you'll be asked for the value in the Render dashboard
      - key: NODE_VERSION
        value: 20
